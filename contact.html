<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Hello World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">Hello World</a>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="stage">
    <svg class="waves waves-top" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="line l1" d="M0,60 C150,10 300,110 450,60 S750,10 900,60 S1100,100 1200,50"/>
      <path class="line l2" d="M0,75 C150,25 300,125 450,75 S750,25 900,75 S1100,115 1200,65"/>
      <path class="line l3" d="M0,90 C150,40 300,140 450,90 S750,40 900,90 S1100,130 1200,80"/>
    </svg>

    <section class="page">
      <h1 class="page-title"><span class="word">Contact</span></h1>
      <svg class="divider small" viewBox="0 0 600 40" aria-hidden="true">
        <defs>
          <linearGradient id="dg" x1="0" x2="1">
            <stop offset="0" stop-color="#ff4d8d"/>
            <stop offset="0.5" stop-color="#ffd23f"/>
            <stop offset="1" stop-color="#2de2e6"/>
          </linearGradient>
        </defs>
        <line class="draw" x1="10" y1="20" x2="270" y2="20" stroke="url(#dg)" stroke-width="3" stroke-linecap="round"/>
        <rect x="288" y="8" width="24" height="24" rx="3" transform="rotate(45 300 20)" fill="none" stroke="#ffd23f" stroke-width="3"/>
        <line class="draw" x1="330" y1="20" x2="590" y2="20" stroke="url(#dg)" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <div class="content">
        <p>Send me a message and your email app will open with it ready to send. Read more <a href="about.html">about this project</a> first if you like.</p>

        <form id="contact-form" class="form">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" required autocomplete="name">

          <label for="email">Your email</label>
          <input id="email" name="email" type="email" required autocomplete="email">

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button class="btn" type="submit">Send message</button>
        </form>
      </div>
    </section>

    <svg class="waves waves-bottom" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="line l1" d="M0,60 C150,110 300,10 450,60 S750,110 900,60 S1100,20 1200,70"/>
      <path class="line l2" d="M0,75 C150,125 300,25 450,75 S750,125 900,75 S1100,35 1200,85"/>
      <path class="line l3" d="M0,90 C150,140 300,40 450,90 S750,140 900,90 S1100,50 1200,100"/>
    </svg>
  </main>

  <script>
    // Opens the visitor's email app with the form contents filled in.
    // Replace the address below with your own email.
    var TO = "your.email@example.com";
    document.getElementById("contact-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("name").value;
      var email = document.getElementById("email").value;
      var msg = document.getElementById("message").value;
      var subject = encodeURIComponent("Message from " + name);
      var body = encodeURIComponent(msg + "\n\nFrom: " + name + " (" + email + ")");
      window.location.href = "mailto:" + TO + "?subject=" + subject + "&body=" + body;
    });
  </script>
</body>
</html>
